name: Release signed native macOS app

on:
  workflow_call:
    inputs:
      project:
        description: Generated .xcodeproj filename relative to working-directory
        required: true
        type: string
      scheme:
        description: Shared Xcode application scheme
        required: true
        type: string
      app-name:
        description: Application product name without the .app suffix
        required: true
        type: string
      dmg-background-path:
        description: Optional 1x PNG path relative to working-directory
        required: false
        type: string
        default: ""
      dmg-background-2x-path:
        description: Optional 2x PNG path relative to working-directory
        required: false
        type: string
        default: ""
      dmg-window-width:
        description: Finder window width in points when artwork is enabled
        required: false
        type: number
        default: 680
      dmg-window-height:
        description: Finder window height including title bar in points when artwork is enabled
        required: false
        type: number
        default: 428
      dmg-icon-size:
        description: Finder icon size in points when artwork is enabled
        required: false
        type: number
        default: 120
      dmg-text-size:
        description: Finder icon label text size in points when artwork is enabled
        required: false
        type: number
        default: 13
      dmg-app-x:
        description: Center x coordinate for the application icon in points
        required: false
        type: number
        default: 180
      dmg-app-y:
        description: Center y coordinate for the application icon in points
        required: false
        type: number
        default: 170
      dmg-applications-x:
        description: Center x coordinate for the Applications icon in points
        required: false
        type: number
        default: 500
      dmg-applications-y:
        description: Center y coordinate for the Applications icon in points
        required: false
        type: number
        default: 170
      working-directory:
        description: Directory containing the XcodeGen project.yml
        required: false
        type: string
        default: .
      release-name:
        description: GitHub Release display name
        required: false
        type: string
        default: ""
      release-body:
        description: Text prepended to generated release notes
        required: false
        type: string
        default: Download the macOS DMG and drag the app to Applications. Use the ZIP for a standalone app. Install future versions manually.
      release-draft:
        description: Leave the GitHub Release as a draft
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned universal app
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      app-sha256: ${{ steps.package.outputs.app-sha256 }}
      ds-store-sha256: ${{ steps.package.outputs.ds-store-sha256 }}
      background-sha256: ${{ steps.package.outputs.background-sha256 }}
      layout-enabled: ${{ steps.package.outputs.layout-enabled }}
    env:
      PROJECT: ${{ inputs.project }}
      SCHEME: ${{ inputs.scheme }}
      APP_NAME: ${{ inputs.app-name }}
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Native releases require a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          if [[ ! "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*\.xcodeproj$ ||
                ! "$SCHEME" =~ ^[A-Za-z0-9][A-Za-z0-9_.\ -]*$ ||
                ! "$APP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_.\ -]*$ ]]; then
            echo "::error::Invalid project, scheme, or application product name."
            exit 1
          fi

      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install verified XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/native-xcodegen"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$tools/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $tools/xcodegen.zip" |
            shasum -a 256 --check
          unzip -q "$tools/xcodegen.zip" -d "$tools"
          echo "$tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate and build Release app
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -showBuildSettings -json > "$RUNNER_TEMP/native-build-settings.json"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          settings = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-build-settings.json").read_text())
          for target in settings:
              values = target["buildSettings"]
              if (values.get("CODE_SIGN_ENTITLEMENTS") or values.get("ENABLE_APP_SANDBOX") == "YES"
                      or "--entitlements" in str(values.get("OTHER_CODE_SIGN_FLAGS", ""))):
                  raise RuntimeError("Custom entitlements and App Sandbox require a separate signing contract.")
          PY
          xcodebuild -quiet -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/native-build" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            INFOPLIST_KEY_CFBundleShortVersionString="${GITHUB_REF_NAME#v}" \
            INFOPLIST_KEY_CFBundleVersion="$GITHUB_RUN_NUMBER" build

      - name: Package unsigned app and optional Finder layout
        id: package
        working-directory: ${{ inputs.working-directory }}
        timeout-minutes: 30
        env:
          DMG_BACKGROUND_PATH: ${{ inputs.dmg-background-path }}
          DMG_BACKGROUND_2X_PATH: ${{ inputs.dmg-background-2x-path }}
          DMG_WINDOW_WIDTH: ${{ inputs.dmg-window-width }}
          DMG_WINDOW_HEIGHT: ${{ inputs.dmg-window-height }}
          DMG_ICON_SIZE: ${{ inputs.dmg-icon-size }}
          DMG_TEXT_SIZE: ${{ inputs.dmg-text-size }}
          DMG_APP_X: ${{ inputs.dmg-app-x }}
          DMG_APP_Y: ${{ inputs.dmg-app-y }}
          DMG_APPLICATIONS_X: ${{ inputs.dmg-applications-x }}
          DMG_APPLICATIONS_Y: ${{ inputs.dmg-applications-y }}
        shell: python3 {0}
        run: |
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import plistlib
          import re
          import shutil
          import subprocess
          import tarfile

          def run(arguments, *, input=None, timeout=120):
              try:
                  result = subprocess.run(arguments, input=input, text=True, capture_output=True, timeout=timeout)
              except subprocess.TimeoutExpired:
                  raise RuntimeError(f"{Path(arguments[0]).name} timed out; protected output withheld.") from None
              if result.returncode:
                  raise RuntimeError(f"{Path(arguments[0]).name} failed (exit {result.returncode}); "
                                     "protected output withheld.")
              return result.stdout

          def integer(name, minimum, maximum):
              value = os.environ[name]
              if not re.fullmatch(r"[0-9]+", value):
                  raise RuntimeError(f"{name} must be an integer.")
              value = int(value)
              if not minimum <= value <= maximum:
                  raise RuntimeError(f"{name} is outside the supported range.")
              return value

          def relative_input(name, root):
              value = os.environ[name]
              path = PurePosixPath(value)
              if (not value or path.is_absolute() or "\\" in value or ":" in value
                      or any(part in ("", ".", "..") for part in path.parts)):
                  raise RuntimeError(f"{name} must be a safe relative path.")
              candidate = root
              for part in path.parts:
                  candidate = candidate / part
                  if candidate.is_symlink():
                      raise RuntimeError(f"{name} must not use symbolic links.")
              try:
                  resolved = candidate.resolve(strict=True)
              except (FileNotFoundError, NotADirectoryError):
                  raise RuntimeError(f"{name} must identify an existing file.") from None
              if not resolved.is_relative_to(root) or not resolved.is_file():
                  raise RuntimeError(f"{name} must identify a regular file under working-directory.")
              if resolved.stat().st_size == 0:
                  raise RuntimeError(f"{name} must be a non-empty file.")
              if resolved.stat().st_size > 20 * 1024 * 1024:
                  raise RuntimeError(f"{name} must be no larger than 20 MiB.")
              with resolved.open("rb") as stream:
                  if stream.read(8) != b"\x89PNG\r\n\x1a\n":
                      raise RuntimeError(f"{name} must contain a PNG image.")
              return resolved

          def png_size(path):
              output = run(["/usr/bin/sips", "-g", "pixelWidth", "-g", "pixelHeight", str(path)])
              dimensions = re.findall(r"pixel(Width|Height):\s*([0-9]+)", output)
              values = {name: int(value) for name, value in dimensions}
              if set(values) != {"Width", "Height"}:
                  raise RuntimeError("Unable to read background PNG dimensions.")
              return values["Width"], values["Height"]

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          app_name = os.environ["APP_NAME"]
          root = Path.cwd().resolve()
          products = Path(os.environ["RUNNER_TEMP"]) / "native-build/Build/Products/Release"
          app = products / (app_name + ".app")
          if app.is_symlink() or not app.is_dir():
              raise RuntimeError("The Xcode build did not produce the requested application bundle.")
          output = Path(os.environ["RUNNER_TEMP"])
          archive_path = output / "unsigned-app.tar"
          with tarfile.open(archive_path, "w") as archive:
              archive.add(app, arcname=app.name, recursive=True)

          background = os.environ["DMG_BACKGROUND_PATH"]
          background_2x = os.environ["DMG_BACKGROUND_2X_PATH"]
          if bool(background) != bool(background_2x):
              raise RuntimeError("Both 1x and 2x DMG backgrounds must be provided together.")

          layout = output / "finder-layout.dmg"
          if background:
              one_x = relative_input("DMG_BACKGROUND_PATH", root)
              two_x = relative_input("DMG_BACKGROUND_2X_PATH", root)
              width = integer("DMG_WINDOW_WIDTH", 160, 10000)
              height = integer("DMG_WINDOW_HEIGHT", 100, 10000)
              icon_size = integer("DMG_ICON_SIZE", 16, 512)
              text_size = integer("DMG_TEXT_SIZE", 8, 32)
              app_x = integer("DMG_APP_X", 0, width)
              app_y = integer("DMG_APP_Y", 0, height - 28)
              applications_x = integer("DMG_APPLICATIONS_X", 0, width)
              applications_y = integer("DMG_APPLICATIONS_Y", 0, height - 28)
              one_width, one_height = png_size(one_x)
              two_width, two_height = png_size(two_x)
              if (one_width != width or two_width != width * 2 or two_height != one_height * 2
                      or height < one_height + 28):
                  raise RuntimeError("DMG artwork must be exact 1x/2x sizes and fit below the Finder title bar.")
              source = output / "finder-layout-source"
              mount = output / "finder-layout-mount"
              if source.exists() or source.is_symlink() or mount.exists() or mount.is_symlink():
                  raise RuntimeError("A Finder layout temporary path already exists.")
              source.mkdir(mode=0o700)
              shutil.copytree(app, source / app.name, symlinks=True)
              (source / "Applications").symlink_to("/Applications", target_is_directory=True)
              background_dir = source / ".background"
              background_dir.mkdir(mode=0o755)
              tiff = background_dir / "background.tiff"
              run(["/usr/bin/tiffutil", "-cathidpicheck", str(one_x), str(two_x), "-out", str(tiff)])
              if tiff.stat().st_size == 0 or tiff.stat().st_size > 40 * 1024 * 1024:
                  raise RuntimeError("The combined Finder background exceeds the supported size.")
              with tiff.open("rb") as stream:
                  if stream.read(4) not in (b"II*\x00", b"MM\x00*"):
                      raise RuntimeError("The combined Finder background is not a TIFF image.")

              layout.unlink(missing_ok=True)
              run(["/usr/bin/hdiutil", "create", "-volname", app_name, "-srcfolder", str(source),
                   "-fs", "HFS+", "-format", "UDRW", str(layout)], timeout=600)
              mount.mkdir(mode=0o700)
              attached_target = None
              try:
                  response = plistlib.loads(run([
                      "/usr/bin/hdiutil", "attach", str(layout), "-readwrite", "-noverify",
                      "-noautoopen", "-owners", "on", "-mountpoint", str(mount), "-plist",
                  ], timeout=120).encode())
                  entities = response.get("system-entities", [])
                  attached_target = next(
                      (entity["mount-point"] for entity in entities if entity.get("mount-point")), None
                  )
                  if attached_target is None:
                      attached_target = next(
                          (entity["dev-entry"] for entity in entities if entity.get("dev-entry")), None
                      )
                  mounted = [entity for entity in entities
                             if entity.get("mount-point")
                             and Path(entity["mount-point"]).resolve() == mount.resolve()]
                  if len(mounted) != 1 or not mount.is_mount():
                      raise RuntimeError("Unable to mount the temporary Finder layout image.")
                  script = r'''
          on run argv
            set mountPath to item 1 of argv
            set appBundle to item 2 of argv
            set windowWidth to (item 3 of argv) as integer
            set windowHeight to (item 4 of argv) as integer
            set iconSize to (item 5 of argv) as integer
            set textSize to (item 6 of argv) as integer
            set appX to (item 7 of argv) as integer
            set appY to (item 8 of argv) as integer
            set applicationsX to (item 9 of argv) as integer
            set applicationsY to (item 10 of argv) as integer
            tell application "Finder"
              activate
              open (POSIX file mountPath as alias)
              delay 1
              set dmgWindow to front window
              set target of dmgWindow to (POSIX file mountPath as alias)
              set current view of dmgWindow to icon view
              set toolbar visible of dmgWindow to false
              set sidebar width of dmgWindow to 0
              set statusbar visible of dmgWindow to false
              set pathbar visible of dmgWindow to false
              set bounds of dmgWindow to {200, 120, 200 + windowWidth, 120 + windowHeight}
              set arrangement of icon view options of dmgWindow to not arranged
              set icon size of icon view options of dmgWindow to iconSize
              set text size of icon view options of dmgWindow to textSize
              set background picture of icon view options of dmgWindow to ¬
                (POSIX file (mountPath & "/.background/background.tiff") as alias)
              set position of item appBundle of dmgWindow to {appX, appY}
              set position of item "Applications" of dmgWindow to {applicationsX, applicationsY}
              delay 2
              if toolbar visible of dmgWindow or sidebar width of dmgWindow is not 0 or ¬
                  statusbar visible of dmgWindow or pathbar visible of dmgWindow then error "Finder chrome remained visible."
              close dmgWindow
              delay 2
              open (POSIX file mountPath as alias)
              delay 1
              set dmgWindow to front window
              if (bounds of dmgWindow) is not {200, 120, 200 + windowWidth, 120 + windowHeight} then ¬
                error "Finder did not persist the requested window bounds."
              if toolbar visible of dmgWindow or sidebar width of dmgWindow is not 0 or ¬
                  statusbar visible of dmgWindow or pathbar visible of dmgWindow then error "Finder did not persist hidden chrome."
              if (icon size of icon view options of dmgWindow) is not iconSize or ¬
                  (text size of icon view options of dmgWindow) is not textSize then error "Finder did not persist icon settings."
              if (position of item appBundle of dmgWindow) is not {appX, appY} or ¬
                  (position of item "Applications" of dmgWindow) is not {applicationsX, applicationsY} then ¬
                error "Finder did not persist icon positions."
              close dmgWindow
            end tell
          end run
          '''
                  run(["/usr/bin/osascript", "-", str(mount), app.name, str(width), str(height),
                       str(icon_size), str(text_size), str(app_x), str(app_y),
                       str(applications_x), str(applications_y)], input=script, timeout=180)
                  run(["/bin/sync"], timeout=60)
              finally:
                  if mount.is_mount():
                      attached_target = str(mount)
                  if attached_target:
                      run(["/usr/bin/hdiutil", "detach", attached_target], timeout=120)

              attached_target = None
              try:
                  response = plistlib.loads(run([
                      "/usr/bin/hdiutil", "attach", str(layout), "-readonly", "-nobrowse",
                      "-noverify", "-noautoopen", "-owners", "on", "-mountpoint", str(mount), "-plist",
                  ], timeout=120).encode())
                  entities = response.get("system-entities", [])
                  attached_target = next(
                      (entity["mount-point"] for entity in entities if entity.get("mount-point")), None
                  )
                  if attached_target is None:
                      attached_target = next(
                          (entity["dev-entry"] for entity in entities if entity.get("dev-entry")), None
                      )
                  mounted = [entity for entity in entities
                             if entity.get("mount-point")
                             and Path(entity["mount-point"]).resolve() == mount.resolve()]
                  if len(mounted) != 1 or not mount.is_mount():
                      raise RuntimeError("Unable to reopen the Finder layout image.")
                  ds_store = mount / ".DS_Store"
                  if ds_store.is_symlink() or not ds_store.is_file() or not 16 <= ds_store.stat().st_size <= 2 * 1024 * 1024:
                      raise RuntimeError("Finder did not save a bounded .DS_Store layout.")
                  with ds_store.open("rb") as stream:
                      if stream.read(8)[4:] != b"Bud1":
                          raise RuntimeError("Finder saved an invalid .DS_Store layout.")
                      content = stream.read()
                  if any(record not in content for record in (b"pBBk", b"bwsp", b"Iloc")):
                      raise RuntimeError("Finder did not save the requested layout records.")
                  payload = output / "finder-layout"
                  (payload / ".background").mkdir(parents=True, mode=0o700)
                  shutil.copy2(ds_store, payload / ".DS_Store")
                  shutil.copy2(mount / ".background/background.tiff", payload / ".background/background.tiff")
              finally:
                  if mount.is_mount():
                      attached_target = str(mount)
                  if attached_target:
                      run(["/usr/bin/hdiutil", "detach", attached_target], timeout=120)
              shutil.rmtree(source)
              shutil.rmtree(mount)

          app_hash = digest(archive_path)
          ds_store_hash = digest(payload / ".DS_Store") if background else ""
          background_hash = digest(payload / ".background/background.tiff") if background else ""
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output_file:
              output_file.write(f"app-sha256={app_hash}\n")
              output_file.write(f"ds-store-sha256={ds_store_hash}\n")
              output_file.write(f"background-sha256={background_hash}\n")
              output_file.write(f"layout-enabled={str(bool(background)).lower()}\n")

      - name: Transfer unsigned bundle
        id: transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos-app
          path: |
            ${{ runner.temp }}/unsigned-app.tar
            ${{ runner.temp }}/finder-layout/.DS_Store
            ${{ runner.temp }}/finder-layout/.background/background.tiff
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release:
    name: Sign, notarize, and publish
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      APP_NAME: ${{ inputs.app-name }}
      DMG_LAYOUT_ENABLED: ${{ inputs.dmg-background-path != '' && inputs.dmg-background-2x-path != '' }}
      UNSIGNED_APP_SHA256: ${{ needs.build.outputs.app-sha256 }}
      FINDER_DS_STORE_SHA256: ${{ needs.build.outputs.ds-store-sha256 }}
      FINDER_BACKGROUND_SHA256: ${{ needs.build.outputs.background-sha256 }}
      BUILD_LAYOUT_ENABLED: ${{ needs.build.outputs.layout-enabled }}
    steps:
      - name: Set temporary signing path
        shell: bash
        run: |
          set -euo pipefail
          printf 'SIGNING_TEMP=%s/native-signing-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Download unsigned bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos-app
          path: ${{ runner.temp }}/native-input

      - name: Extract unsigned bundle
        shell: python3 {0}
        run: |
          import hashlib
          import os
          import pathlib
          import posixpath
          import sys
          import tarfile

          if sys.version_info < (3, 12):
              raise RuntimeError("Python 3.12 or newer is required for safe bundle extraction.")
          root = pathlib.Path(os.environ["SIGNING_TEMP"])
          root.mkdir(mode=0o700)
          input_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-input"
          archive_path = input_dir / "unsigned-app.tar"
          metadata_dir = input_dir / "finder-layout"
          expected_layout = os.environ["DMG_LAYOUT_ENABLED"] == "true"
          if expected_layout != (os.environ["BUILD_LAYOUT_ENABLED"] == "true"):
              raise RuntimeError("The unsigned artifact layout does not match the requested workflow inputs.")
          expected_files = {"unsigned-app.tar", "finder-layout"} \
              if expected_layout else {"unsigned-app.tar"}
          if {path.name for path in input_dir.iterdir()} != expected_files:
              raise RuntimeError("The unsigned artifact contains unexpected files.")
          if archive_path.is_symlink() or not archive_path.is_file():
              raise RuntimeError("The unsigned app artifact must be a regular file.")
          for path, expected in ((archive_path, os.environ["UNSIGNED_APP_SHA256"]),):
              with path.open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if not expected or actual != expected:
                  raise RuntimeError("The unsigned app artifact digest does not match the build job output.")
          if expected_layout:
              if metadata_dir.is_symlink() or not metadata_dir.is_dir() or {
                      path.relative_to(metadata_dir).as_posix() for path in metadata_dir.rglob("*")
              } != {".DS_Store", ".background", ".background/background.tiff"}:
                  raise RuntimeError("The Finder metadata artifact contains unexpected files.")
              ds_store = metadata_dir / ".DS_Store"
              background = metadata_dir / ".background/background.tiff"
              if (ds_store.is_symlink() or not ds_store.is_file()
                      or (metadata_dir / ".background").is_symlink()
                      or not (metadata_dir / ".background").is_dir()
                      or background.is_symlink() or not background.is_file()):
                  raise RuntimeError("The Finder metadata artifact must contain regular files.")
              for path, expected in ((ds_store, os.environ["FINDER_DS_STORE_SHA256"]),
                                     (background, os.environ["FINDER_BACKGROUND_SHA256"])):
                  with path.open("rb") as stream:
                      actual = hashlib.file_digest(stream, "sha256").hexdigest()
                  if not expected or actual != expected:
                      raise RuntimeError("The Finder metadata digest does not match the build job output.")
              if not 16 <= ds_store.stat().st_size <= 2 * 1024 * 1024:
                  raise RuntimeError("The Finder .DS_Store is outside the supported size.")
              with ds_store.open("rb") as stream:
                  if stream.read(8)[4:] != b"Bud1":
                      raise RuntimeError("The Finder .DS_Store has an invalid signature.")
              if not 4 <= background.stat().st_size <= 40 * 1024 * 1024:
                  raise RuntimeError("The Finder background is outside the supported size.")
              with background.open("rb") as stream:
                  if stream.read(4) not in (b"II*\x00", b"MM\x00*"):
                      raise RuntimeError("The Finder background is not a TIFF image.")

          app_prefix = os.environ["APP_NAME"] + ".app"
          with tarfile.open(archive_path) as archive:
              members = archive.getmembers()
              names = [pathlib.PurePosixPath(member.name).as_posix() for member in members]
              if len(names) != len(set(names)):
                  raise RuntimeError("The unsigned archive contains duplicate paths.")
              regular_files = set()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if (not path.parts or path.is_absolute() or "\\" in member.name
                          or ".." in path.parts or path.parts[0] != app_prefix
                          or path.name.startswith("._")):
                      raise RuntimeError("The unsigned archive contains an unexpected path.")
                  if not (member.isdir() or member.isfile() or member.issym() or member.islnk()):
                      raise RuntimeError("The unsigned archive contains an unsupported filesystem entry.")
                  if member.islnk():
                      target = pathlib.PurePosixPath(member.linkname)
                      if (target.is_absolute() or "\\" in member.linkname or ".." in target.parts
                              or target.as_posix() not in regular_files):
                          raise RuntimeError("The unsigned archive contains an unsafe hard link.")
                  if member.issym():
                      target = member.linkname
                      resolved = posixpath.normpath(posixpath.join(posixpath.dirname(member.name), target))
                      if target.startswith("/") or resolved != app_prefix and not resolved.startswith(app_prefix + "/"):
                          raise RuntimeError("The unsigned archive contains an escaping symbolic link.")
                  if member.isfile():
                      regular_files.add(path.as_posix())
              if not members or not any(member.name.rstrip("/") == app_prefix for member in members):
                  raise RuntimeError("The unsigned archive does not contain the requested application.")
              if any(pathlib.PurePosixPath(member.name).name.startswith("._") for member in members):
                  raise RuntimeError("The unsigned archive contains unsupported AppleDouble metadata.")
              products = root / "products"
              products.mkdir(mode=0o700)
              archive.extractall(products, filter="data")
          app = products / (os.environ["APP_NAME"] + ".app")
          if list(products.iterdir()) != [app] or app.is_symlink() or not app.is_dir():
              raise RuntimeError("The artifact must contain exactly the requested application bundle.")

      - name: Sign in to Azure with OIDC
        id: azure-login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign and notarize native app
        timeout-minutes: 50
        env:
          VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        shell: python3 {0}
        run: |
          import base64
          import contextlib
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import re
          import secrets
          import shlex
          import shutil
          import stat
          import subprocess

          def run(arguments, *, input=None, env=None, timeout=120):
              try:
                  result = subprocess.run(arguments, input=input, env=env, text=True,
                                          capture_output=True, timeout=timeout)
              except subprocess.TimeoutExpired:
                  raise RuntimeError(f"{pathlib.Path(arguments[0]).name} timed out; "
                                     "protected output withheld.") from None
              if result.returncode:
                  raise RuntimeError(f"{pathlib.Path(arguments[0]).name} failed "
                                     f"(exit {result.returncode}); protected output withheld.")
              return result.stdout

          def codesign(options, *, operation, path, root):
              relative = path.relative_to(root).as_posix()
              target = json.dumps(relative[:120] + ("..." if len(relative) > 120 else ""))
              try:
                  result = subprocess.run(["/usr/bin/codesign", *options, str(path)], text=True,
                                          errors="replace", capture_output=True, timeout=120)
              except subprocess.TimeoutExpired:
                  raise RuntimeError(f"codesign {operation} timed out for target {target}; "
                                     "protected output withheld.") from None
              if result.returncode:
                  output = (result.stdout[:8192] + "\n" + result.stderr[:8192]).casefold()
                  # Emit fixed phrases only, never raw lines, paths, or signer metadata.
                  diagnostics = [phrase for phrase in (
                      "errSecInternalComponent",
                      "CSSMERR_TP_NOT_TRUSTED",
                      "User interaction is not allowed",
                      "The specified item could not be found in the keychain",
                      "unable to build chain to self-signed root",
                      "no identity found",
                      "The timestamp service is not available",
                      "A timestamp was expected but was not found",
                      "Operation not permitted",
                      "resource fork, Finder information, or similar detritus not allowed",
                      "bundle format unrecognized, invalid, or unsuitable",
                      "bundle format is ambiguous",
                      "code object is not signed at all",
                      "a sealed resource is missing or invalid",
                      "invalid signature (code or signature have been modified)",
                      "nested code is modified or invalid",
                      "unsealed contents present in the root directory of an embedded framework",
                      "internal error in Code Signing subsystem",
                  ) if phrase.casefold() in output][:4]
                  detail = ("codesign reported: " + "; ".join(diagnostics) if diagnostics else
                            "unrecognized diagnostic; protected output withheld.")
                  raise RuntimeError(f"codesign {operation} failed for target {target} "
                                     f"(exit {result.returncode}); {detail}")
              return result.stdout

          def mask(value):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::add-mask::" + escaped, flush=True)

          def fetch_secret(vault, name):
              value = run(["az", "keyvault", "secret", "show",
                           "--id", f"{vault}/secrets/{name}", "--query", "value", "--output", "json"])
              value = json.loads(value)
              if not isinstance(value, str) or not value:
                  raise RuntimeError(f"Required Key Vault secret '{name}' is empty.")
              mask(value)
              return value

          def security(arguments):
              # Only generated hex passwords reach security's non-shell stdin parser.
              run(["/usr/bin/security", "-i"], input=shlex.join(arguments) + "\n")

          def import_identity(root, certificate, password):
              keychain = root / "signing.keychain-db"
              keychain_password = secrets.token_hex(32)
              import_password = secrets.token_hex(32)
              mask(keychain_password)
              mask(import_password)
              keychains = shlex.split(run(["/usr/bin/security", "list-keychains", "-d", "user"]))
              (root / "keychains.json").write_text(json.dumps(keychains))
              original = root / "certificate.p12"
              original.write_bytes(base64.b64decode(certificate, validate=True))
              pem = root / "certificate.pem"
              repacked = root / "import.p12"
              environment = dict(os.environ, CERTIFICATE_PASSWORD=password, IMPORT_PASSWORD=import_password)
              run(["/usr/bin/openssl", "pkcs12", "-in", str(original), "-nodes",
                   "-passin", "env:CERTIFICATE_PASSWORD", "-out", str(pem)], env=environment)
              run(["/usr/bin/openssl", "pkcs12", "-export", "-in", str(pem),
                   "-out", str(repacked), "-passout", "env:IMPORT_PASSWORD"], env=environment)
              security(["create-keychain", "-p", keychain_password, str(keychain)])
              run(["/usr/bin/security", "set-keychain-settings", "-lut", "3600", str(keychain)])
              security(["unlock-keychain", "-p", keychain_password, str(keychain)])
              security(["import", str(repacked), "-k", str(keychain), "-P", import_password,
                        "-T", "/usr/bin/codesign"])
              security(["set-key-partition-list", "-S", "apple-tool:,apple:,codesign:",
                        "-s", "-k", keychain_password, str(keychain)])
              # --keychain selects the identity, not the certificate-chain search list.
              run(["/usr/bin/security", "list-keychains", "-d", "user", "-s", str(keychain), *keychains])
              for path in (original, pem, repacked):
                  path.unlink()
              return keychain

          def code_objects(app):
              objects = []
              for path in app.rglob("*"):
                  if path.is_symlink():
                      continue
                  if path.suffix in (".app", ".appex", ".xpc"):
                      raise RuntimeError("Nested applications, extensions, and XPC services are not supported.")
                  if path.is_dir() and (path.suffix == ".framework" or (
                          path.suffix == ".bundle" and
                          ((path / "Contents/Info.plist").is_file() or (path / "Info.plist").is_file()))):
                      objects.append(path)
                  elif path.is_file():
                      with path.open("rb") as stream:
                          magic = stream.read(4)
                      if magic in (b"\xfe\xed\xfa\xce", b"\xce\xfa\xed\xfe",
                                   b"\xfe\xed\xfa\xcf", b"\xcf\xfa\xed\xfe",
                                   b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca",
                                   b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca"):
                          architectures = run(["/usr/bin/lipo", "-archs", str(path)]).split()
                          if not {"arm64", "x86_64"}.issubset(architectures):
                              raise RuntimeError("Every Mach-O must contain arm64 and x86_64 slices.")
                          objects.append(path)
              return sorted(objects, key=lambda path: len(path.parts), reverse=True) + [app]

          def notarize(app, root, keychain, password):
              if any(character in password for character in "\r\n\0"):
                  raise RuntimeError("The notarization password must be a single line.")
              run(["/usr/bin/xcrun", "notarytool", "store-credentials", "native-release",
                   "--apple-id", os.environ["APPLE_ID"], "--team-id", os.environ["APPLE_TEAM_ID"],
                   "--keychain", str(keychain)], input=password + "\n")
              submission = root / "submission.zip"
              run(["/usr/bin/ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(app), str(submission)])
              submit_and_staple(app, submission, keychain)
              codesign(["--verify", "--deep", "--strict"],
                       operation="verify stapled bundle", path=app, root=app)
              run(["/usr/sbin/spctl", "--assess", "--type", "execute", str(app)])

          def submit_and_staple(target, submission, keychain):
              result = json.loads(run(["/usr/bin/xcrun", "notarytool", "submit", str(submission),
                                       "--keychain-profile", "native-release", "--keychain", str(keychain),
                                       "--wait", "--timeout", "15m", "--output-format", "json"], timeout=960))
              if result.get("status") != "Accepted":
                  raise RuntimeError("Apple did not accept the notarization submission.")
              run(["/usr/bin/xcrun", "stapler", "staple", str(target)])
              run(["/usr/bin/xcrun", "stapler", "validate", str(target)])

          def distribution_modes(app):
              # Signing and stapling can create files under the private signing umask.
              for path in [app, *app.rglob("*")]:
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode):
                      continue
                  if stat.S_ISDIR(mode):
                      path.chmod(0o755)
                  elif stat.S_ISREG(mode):
                      path.chmod(0o755 if mode & 0o111 else 0o644)
                  else:
                      raise RuntimeError("The application contains an unsupported filesystem entry.")

          def bundle_digest(bundle):
              digest = hashlib.sha256()
              paths = sorted([bundle, *bundle.rglob("*")],
                             key=lambda path: path.relative_to(bundle.parent).as_posix())
              for path in paths:
                  relative = path.relative_to(bundle.parent).as_posix()
                  metadata = path.lstat()
                  if stat.S_ISLNK(metadata.st_mode):
                      kind = "symlink"
                      content = os.readlink(path)
                  elif stat.S_ISDIR(metadata.st_mode):
                      kind = "directory"
                      content = ""
                  elif stat.S_ISREG(metadata.st_mode):
                      kind = "file"
                      with path.open("rb") as stream:
                          content = hashlib.file_digest(stream, "sha256").hexdigest()
                  else:
                      raise RuntimeError("The application contains an unsupported filesystem entry.")
                  attributes = extended_attributes(path)
                  entry = {
                      "path": relative,
                      "type": kind,
                      "mode": stat.S_IMODE(metadata.st_mode),
                      "flags": getattr(metadata, "st_flags", 0),
                      "content": content,
                      "xattrs": attributes,
                  }
                  digest.update(json.dumps(entry, sort_keys=True, separators=(",", ":")).encode())
                  digest.update(b"\0")
              return digest.hexdigest()

          def extended_attributes(path):
              if hasattr(os, "listxattr") and hasattr(os, "getxattr"):
                  return {
                      name: os.getxattr(path, name, follow_symlinks=False).hex()
                      for name in sorted(os.listxattr(path, follow_symlinks=False))
                  }
              listed = subprocess.run(["/usr/bin/xattr", "-s", str(path)], capture_output=True)
              if listed.returncode:
                  raise RuntimeError("Unable to read application extended attributes.")
              try:
                  names = listed.stdout.decode("utf-8").splitlines()
              except UnicodeDecodeError:
                  raise RuntimeError("Application extended-attribute names are not valid UTF-8.") from None
              attributes = {}
              for name in sorted(names):
                  result = subprocess.run(
                      ["/usr/bin/xattr", "-s", "-p", name, str(path)], capture_output=True
                  )
                  if result.returncode:
                      raise RuntimeError("Unable to read an application extended attribute.")
                  attributes[name] = result.stdout.hex()
              return attributes

          @contextlib.contextmanager
          def mounted_image(image, mount, *, readonly):
              mount.mkdir(mode=0o700)
              attached_target = None
              try:
                  response = plistlib.loads(run([
                      "/usr/bin/hdiutil", "attach", str(image),
                      "-readonly" if readonly else "-readwrite", "-noverify", "-noautoopen",
                      "-owners", "on", "-mountpoint", str(mount), "-plist",
                  ], timeout=120).encode())
                  entities = response.get("system-entities", [])
                  attached_target = next(
                      (entity["mount-point"] for entity in entities if entity.get("mount-point")), None
                  )
                  if attached_target is None:
                      attached_target = next(
                          (entity["dev-entry"] for entity in entities if entity.get("dev-entry")), None
                      )
                  mounted = [entity for entity in entities
                             if entity.get("mount-point")
                             and pathlib.Path(entity["mount-point"]).resolve() == mount.resolve()]
                  if len(mounted) != 1 or not mount.is_mount():
                      raise RuntimeError("The disk image did not mount at its requested path.")
                  yield mounted[0]
              finally:
                  if mount.is_mount():
                      attached_target = str(mount)
                  if attached_target:
                      run(["/usr/bin/hdiutil", "detach", attached_target], timeout=120)
                  if mount.exists():
                      mount.rmdir()

          def layout_digests(mount, app):
              expected_names = {app.name, "Applications", ".background", ".DS_Store"}
              system_names = {".fseventsd", ".Trashes", ".Spotlight-V100", ".TemporaryItems"}
              names = {path.name for path in mount.iterdir()}
              if not expected_names.issubset(names) or not names.issubset(expected_names | system_names):
                  raise RuntimeError("The Finder layout image contains unexpected top-level items.")
              for name in names & system_names:
                  system_path = mount / name
                  if system_path.is_symlink() or not system_path.is_dir():
                      raise RuntimeError("The Finder layout image contains an invalid system directory.")
              applications = mount / "Applications"
              background_dir = mount / ".background"
              ds_store = mount / ".DS_Store"
              background = background_dir / "background.tiff"
              if (not applications.is_symlink() or os.readlink(applications) != "/Applications"
                      or not background_dir.is_dir() or background_dir.is_symlink()
                      or {path.name for path in background_dir.iterdir()} != {"background.tiff"}
                      or background.is_symlink() or not background.is_file()
                      or ds_store.is_symlink() or not ds_store.is_file()):
                  raise RuntimeError("The Finder layout image does not contain its exact layout payload.")
              if not 16 <= ds_store.stat().st_size <= 2 * 1024 * 1024:
                  raise RuntimeError("The Finder layout .DS_Store is outside the supported size.")
              with ds_store.open("rb") as stream:
                  if stream.read(8)[4:] != b"Bud1":
                      raise RuntimeError("The Finder layout .DS_Store has an invalid signature.")
              if not 4 <= background.stat().st_size <= 40 * 1024 * 1024:
                  raise RuntimeError("The Finder background is outside the supported size.")
              with background.open("rb") as stream:
                  if stream.read(4) not in (b"II*\x00", b"MM\x00*"):
                      raise RuntimeError("The Finder background is not a TIFF image.")
              if app.is_symlink() or not app.is_dir():
                  raise RuntimeError("The Finder layout does not contain the requested application.")
              return digest_file(ds_store), digest_file(background)

          def digest_file(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def verify_disk_image(image, app, root, expected_digest, expected_layout):
              mount = root / "final-image-mount"
              with mounted_image(image, mount, readonly=True):
                  mounted_app = mount / app.name
                  if mounted_app.is_symlink() or not mounted_app.is_dir():
                      raise RuntimeError("The final disk image does not contain the requested application.")
                  expected_names = {app.name, "Applications"}
                  if expected_layout is not None:
                      expected_names.update((".DS_Store", ".background"))
                      actual_layout = layout_digests(mount, app)
                      if actual_layout != expected_layout:
                          raise RuntimeError("Finder layout metadata changed during disk image conversion.")
                  if not expected_names.issubset({path.name for path in mount.iterdir()}):
                      raise RuntimeError("The final disk image is missing required items.")
                  if bundle_digest(mounted_app) != expected_digest:
                      raise RuntimeError("The signed application changed during disk image conversion.")
                  if os.readlink(mount / "Applications") != "/Applications":
                      raise RuntimeError("The final disk image has an invalid Applications symlink.")
                  codesign(["--verify", "--deep", "--strict"],
                           operation="verify mounted bundle", path=mounted_app, root=mounted_app)
                  run(["/usr/bin/xcrun", "stapler", "validate", str(mounted_app)])
                  run(["/usr/sbin/spctl", "--assess", "--type", "execute", str(mounted_app)])

          def create_disk_image(app, root, asset, layout_metadata=None):
              expected_digest = bundle_digest(app)
              expected_layout = None
              staging = root / "disk-image"
              staging.mkdir()
              staging.chmod(0o755)
              staged_app = staging / app.name
              run(["/usr/bin/ditto", str(app), str(staged_app)])
              distribution_modes(staged_app)
              (staging / "Applications").symlink_to("/Applications", target_is_directory=True)
              codesign(["--verify", "--deep", "--strict"],
                       operation="verify staged bundle", path=staged_app, root=staged_app)
              run(["/usr/bin/xcrun", "stapler", "validate", str(staged_app)])
              if layout_metadata is not None:
                  ds_store = layout_metadata / ".DS_Store"
                  background = layout_metadata / ".background/background.tiff"
                  expected_layout = (digest_file(ds_store), digest_file(background))
                  if expected_layout != (os.environ["FINDER_DS_STORE_SHA256"],
                                         os.environ["FINDER_BACKGROUND_SHA256"]):
                      raise RuntimeError("The Finder metadata changed after artifact validation.")
                  (staging / ".background").mkdir()
                  shutil.copyfile(ds_store, staging / ".DS_Store")
                  shutil.copyfile(background, staging / ".background/background.tiff")
                  (staging / ".background").chmod(0o755)
                  (staging / ".DS_Store").chmod(0o644)
                  (staging / ".background/background.tiff").chmod(0o644)
              run(["/usr/bin/hdiutil", "create", "-volname", app.stem, "-srcfolder", str(staging),
                   "-fs", "HFS+", "-format", "UDZO", str(asset)], timeout=600)
              if bundle_digest(staged_app) != expected_digest:
                  raise RuntimeError("Copying the signed app changed its bytes or metadata.")
              return expected_digest, expected_layout

          def verify_developer_id(path, root, team):
              codesign(["--verify", "--strict", "-R",
                   '=anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists '
                   'and certificate leaf[field.1.2.840.113635.100.6.1.13] exists '
                   f'and certificate leaf[subject.OU] = "{team}"'],
                   operation="verify Developer ID", path=path, root=root)

          def main():
              os.umask(0o077)
              root = pathlib.Path(os.environ["SIGNING_TEMP"])
              if not re.fullmatch(r"/[A-Za-z0-9/_.-]+", str(root)):
                  raise RuntimeError("The temporary signing path contains unsupported characters.")
              vault = os.environ["VAULT_URI"].rstrip("/")
              if not re.fullmatch(r"https://[a-z][a-z0-9-]{1,22}[a-z0-9]\.vault\.azure\.net", vault):
                  raise RuntimeError("AZURE_KEY_VAULT_URI is missing or invalid.")
              for name in ("APPLE_ID", "APPLE_TEAM_ID", "APPLE_SIGNING_IDENTITY"):
                  if not os.environ[name]:
                      raise RuntimeError(f"{name} must be configured in the release environment.")
              identity = os.environ["APPLE_SIGNING_IDENTITY"]
              team = os.environ["APPLE_TEAM_ID"]
              if not re.fullmatch(r"[A-Z0-9]{10}", team):
                  raise RuntimeError("APPLE_TEAM_ID must be a ten-character Apple Team ID.")
              if not identity.startswith("Developer ID Application: ") or not identity.endswith(f"({team})"):
                  raise RuntimeError("APPLE_SIGNING_IDENTITY must be a Developer ID Application for APPLE_TEAM_ID.")
              app = root / "products" / (os.environ["APP_NAME"] + ".app")
              with (app / "Contents/Info.plist").open("rb") as stream:
                  info = plistlib.load(stream)
              if info.get("CFBundleShortVersionString") != os.environ["GITHUB_REF_NAME"][1:]:
                  raise RuntimeError("The application version does not match the release tag.")
              if str(info.get("CFBundleVersion")) != os.environ["GITHUB_RUN_NUMBER"]:
                  raise RuntimeError("The application build version does not match the run number.")
              objects = code_objects(app)
              keychain = import_identity(root, fetch_secret(vault, "apple-developer-id-certificate"),
                                         fetch_secret(vault, "apple-developer-id-password"))
              identities = run(["/usr/bin/security", "find-identity", "-v", "-p", "codesigning", str(keychain)])
              if f'"{identity}"' not in identities:
                  raise RuntimeError("The vault certificate does not contain the configured valid signing identity.")
              for path in objects:
                  codesign(["--force", "--sign", identity, "--keychain", str(keychain),
                            "--options", "runtime", "--timestamp"], operation="sign", path=path, root=app)
              codesign(["--verify", "--deep", "--strict"],
                       operation="verify signed bundle", path=app, root=app)
              verify_developer_id(app, app, team)
              notarize(app, root, keychain, fetch_secret(vault, "apple-notarization-password"))
              distribution_modes(app)
              codesign(["--verify", "--deep", "--strict"],
                       operation="verify distributable bundle", path=app, root=app)
              run(["/usr/bin/xcrun", "stapler", "validate", str(app)])
              output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-release"
              output.mkdir(mode=0o700)
              asset_name = os.environ["APP_NAME"].replace(" ", ".")
              basename = f'{asset_name}-{os.environ["GITHUB_REF_NAME"]}-universal-macos'
              asset = output / (basename + ".zip")
              run(["/usr/bin/ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(app), str(asset)])
              image = output / (basename + ".dmg")
              layout_metadata = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-input/finder-layout"
              if os.environ["DMG_LAYOUT_ENABLED"] != "true":
                  layout_metadata = None
              expected_digest, expected_layout = create_disk_image(app, root, image, layout_metadata)
              codesign(["--force", "--sign", identity, "--keychain", str(keychain), "--timestamp"],
                       operation="sign disk image", path=image, root=output)
              verify_developer_id(image, output, team)
              submit_and_staple(image, image, keychain)
              codesign(["--verify", "--strict"], operation="verify stapled disk image", path=image, root=output)
              verify_developer_id(image, output, team)
              run(["/usr/bin/hdiutil", "verify", str(image)], timeout=600)
              run(["/usr/sbin/spctl", "--assess", "--type", "open",
                   "--context", "context:primary-signature", str(image)])
              verify_disk_image(image, app, root, expected_digest, expected_layout)

          if __name__ == "__main__":
              main()

      - name: Remove temporary native credentials
        if: always()
        shell: python3 {0}
        run: |
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          root = pathlib.Path(os.environ["SIGNING_TEMP"])
          if root.parent != pathlib.Path(os.environ["RUNNER_TEMP"]) or not root.name.startswith("native-signing-"):
              raise RuntimeError("Refusing to clean an unexpected signing directory.")
          errors = []
          keychain = root / "signing.keychain-db"
          if keychain.exists():
              result = subprocess.run(["/usr/bin/security", "delete-keychain", str(keychain)],
                                      capture_output=True)
              if result.returncode:
                  errors.append("Unable to delete the temporary signing keychain.")
          snapshot = root / "keychains.json"
          if snapshot.exists():
              result = subprocess.run(["/usr/bin/security", "list-keychains", "-d", "user", "-s",
                                       *json.loads(snapshot.read_text())], capture_output=True)
              if result.returncode:
                  errors.append("Unable to restore the keychain search list.")
          for name in ("certificate.p12", "certificate.pem", "import.p12"):
              (root / name).unlink(missing_ok=True)
          if not errors and root.exists():
              shutil.rmtree(root)
          if errors:
              raise RuntimeError(" ".join(errors))

      - name: Clear Azure session
        if: always() && steps.azure-login.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          az logout
          az account clear

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release-name || format('{0} {1}', github.event.repository.name, github.ref_name) }}
          RELEASE_BODY: ${{ inputs.release-body }}
          RELEASE_DRAFT: ${{ inputs.release-draft }}
        shell: python3 {0}
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def gh(arguments):
              return subprocess.run(["gh", *arguments], text=True, capture_output=True, check=True).stdout

          tag = os.environ["GITHUB_REF_NAME"]
          repository = os.environ["GITHUB_REPOSITORY"]
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-release"
          asset_name = os.environ["APP_NAME"].replace(" ", ".")
          basename = f'{asset_name}-{tag}-universal-macos'
          assets = [output / (basename + suffix) for suffix in (".zip", ".dmg")]
          if (not output.is_dir() or set(output.iterdir()) != set(assets)
                  or any(asset.is_symlink() or not asset.is_file() or asset.stat().st_size == 0
                         for asset in assets)):
              raise RuntimeError("The signed release assets must be exactly the nonempty ZIP and DMG.")
          # Hash only final signed/stapled bytes; GitHub exposes these digests on release assets.
          expected = {}
          for asset in assets:
              with asset.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              expected[asset.name] = (asset.stat().st_size, "sha256:" + digest)
          pages = json.loads(gh(["api", "--paginate", "--slurp", f"repos/{repository}/releases"]))
          matches = [release for page in pages for release in page if release["tag_name"] == tag]
          if len(matches) > 1:
              raise RuntimeError("Multiple releases already use this tag; operator review is required.")
          if matches and not matches[0]["draft"]:
              raise RuntimeError("Refusing to replace assets on an already published release.")
          if not matches:
              notes = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-release-notes.txt"
              notes.write_text(os.environ["RELEASE_BODY"])
              gh(["release", "create", tag, "--repo", repository, "--verify-tag", "--draft",
                  "--title", os.environ["RELEASE_NAME"], "--notes-file", str(notes), "--generate-notes"])
          release = json.loads(gh(["release", "view", tag, "--repo", repository, "--json", "isDraft,databaseId"]))
          if not release["isDraft"]:
              raise RuntimeError("The release is no longer a draft; refusing further changes.")
          gh(["release", "upload", tag, *map(str, assets), "--repo", repository, "--clobber"])
          release = json.loads(gh(["release", "view", tag, "--repo", repository, "--json", "isDraft,databaseId"]))
          if not release["isDraft"]:
              raise RuntimeError("The release is no longer a draft; refusing further changes.")
          pages = json.loads(gh(["api", "--paginate", "--slurp",
                                f'repos/{repository}/releases/{release["databaseId"]}/assets']))
          uploaded = [asset for page in pages for asset in page if asset["name"] in expected]
          if len(uploaded) != len(expected) or {asset["name"] for asset in uploaded} != set(expected):
              raise RuntimeError("The release does not contain both uploaded native assets.")
          for asset in uploaded:
              if asset.get("digest") is None:
                  raise RuntimeError("GitHub has not provided a SHA-256 digest for an uploaded native asset; "
                                     "leaving the release draft for review or retry.")
              if asset["state"] != "uploaded" or (asset["size"], asset["digest"]) != expected[asset["name"]]:
                  raise RuntimeError("An uploaded native asset does not match the final local artifact.")
          if os.environ["RELEASE_DRAFT"] == "false":
              gh(["release", "edit", tag, "--repo", repository, "--draft=false"])

      - name: Remove temporary native release files
        if: always()
        shell: python3 {0}
        run: |
          import os
          import pathlib
          import shutil

          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("native-release", "native-input"):
              path = temporary / name
              if path.is_symlink():
                  path.unlink()
              elif path.exists():
                  shutil.rmtree(path)
          (temporary / "native-release-notes.txt").unlink(missing_ok=True)
