name: Release signed macOS Tauri app

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing package-lock.json and the Tauri project
        required: false
        type: string
        default: .
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "26"
      release-name:
        description: GitHub Release display name
        required: false
        type: string
        default: ""
      release-body:
        description: Text prepended to generated release notes
        required: false
        type: string
        default: Download the `.dmg` asset below to install.
      release-draft:
        description: Create the GitHub Release as a draft
        required: false
        type: boolean
        default: true

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Require a version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Signing releases requires a v* tag; received $GITHUB_REF."
            exit 1
          fi

      - name: Check out caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-src-tauri
          workspaces: ${{ inputs.working-directory }}/src-tauri -> target

      - name: Install JavaScript dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Load signing credentials
        id: signing-credentials
        env:
          VAULT_URI: ${{ vars.AZURE_KEY_VAULT_URI }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VAULT_URI" =~ ^https://[a-z][a-z0-9-]{1,22}[a-z0-9]\.vault\.azure\.net/?$ ]]; then
            echo "::error::AZURE_KEY_VAULT_URI is missing or invalid."
            exit 1
          fi
          vault_uri="${VAULT_URI%/}"
          profile="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]/_.' '[:lower:]---')"
          profile="$(printf '%s' "$profile" | sed -E 's/-+/-/g; s/^-|-$//g')"
          if (( ${#profile} > 80 )); then
            echo "::error::The normalized repository name exceeds the supported vault schema length."
            exit 1
          fi

          fetch_secret() {
            local name
            local value
            name="$1"
            if ! value="$(az keyvault secret show \
              --id "$vault_uri/secrets/$name" \
              --query value \
              --output tsv)"; then
              echo "::error::Unable to read required Key Vault secret '$name'." >&2
              exit 1
            fi
            if [[ -z "$value" ]]; then
              echo "::error::Required Key Vault secret '$name' is empty." >&2
              exit 1
            fi
            printf '%s' "$value"
          }

          mask_secret() {
            local value
            value="$1"
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -n "$line" ]] && echo "::add-mask::$line"
            done <<< "$value"
          }

          write_output() {
            local name
            local value
            local delimiter
            name="$1"
            value="$2"
            delimiter="SIGNING_$(uuidgen)"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          apple_certificate="$(fetch_secret apple-developer-id-certificate)"
          apple_certificate_password="$(fetch_secret apple-developer-id-password)"
          apple_password="$(fetch_secret apple-notarization-password)"
          updater_key="$(fetch_secret "repo-$profile-tauri-private-key")"
          updater_password="$(fetch_secret "repo-$profile-tauri-private-key-password")"

          mask_secret "$apple_certificate"
          mask_secret "$apple_certificate_password"
          mask_secret "$apple_password"
          mask_secret "$updater_key"
          mask_secret "$updater_password"

          key_file="$RUNNER_TEMP/tauri-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.key"
          umask 077
          if ! printf '%s' "$updater_key" | /usr/bin/openssl base64 -d -A -out "$key_file"; then
            echo "::error::The updater private key is not valid base64."
            exit 1
          fi
          chmod 600 "$key_file"

          [[ "$updater_password" == "__EMPTY__" ]] && updater_password=""

          write_output apple-certificate "$apple_certificate"
          write_output apple-certificate-password "$apple_certificate_password"
          write_output apple-password "$apple_password"
          write_output tauri-signing-private-key "$key_file"
          write_output tauri-signing-private-key-password "$updater_password"

      - name: Validate Apple signing metadata
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name must be configured in the release environment."
              exit 1
            fi
          done

      - name: Build, sign, notarize, and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ steps.signing-credentials.outputs.apple-certificate }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing-credentials.outputs.apple-certificate-password }}
          APPLE_PASSWORD: ${{ steps.signing-credentials.outputs.apple-password }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing-credentials.outputs.tauri-signing-private-key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.signing-credentials.outputs.tauri-signing-private-key-password }}
        with:
          projectPath: ${{ inputs.working-directory }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ inputs.release-name || format('{0} {1}', github.event.repository.name, github.ref_name) }}
          releaseBody: ${{ inputs.release-body }}
          generateReleaseNotes: true
          releaseDraft: ${{ inputs.release-draft }}
          prerelease: false
          args: --target universal-apple-darwin

      - name: Remove temporary credentials
        if: always()
        shell: bash
        env:
          TAURI_KEY_FILE: ${{ runner.temp }}/tauri-signing-${{ github.run_id }}-${{ github.run_attempt }}.key
        run: |
          set +e
          if [[ -n "${TAURI_KEY_FILE:-}" && "$TAURI_KEY_FILE" == "$RUNNER_TEMP/"* ]]; then
            rm -f -- "$TAURI_KEY_FILE"
          fi
          az logout >/dev/null 2>&1
          az account clear >/dev/null 2>&1
