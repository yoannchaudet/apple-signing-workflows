name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  powershell:
    name: PowerShell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install test modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error -EnableExit
          Invoke-ScriptAnalyzer -Path tests -Recurse -Severity Warning,Error -EnableExit

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester -Path tests -CI

      - name: Guard tracked content
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File tests/Test-TrackedContent.ps1
